# Google Cloud Build configuration for Song-to-Sheet Music System

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/song-to-sheet-music:$BUILD_ID'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/song-to-sheet-music:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/song-to-sheet-music:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '.'
    timeout: 3600s

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/song-to-sheet-music:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/song-to-sheet-music:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'song-to-sheet-music'
      - '--image'
      - 'gcr.io/$PROJECT_ID/song-to-sheet-music:$BUILD_ID'
      - '--region'
      - 'europe-west4'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '16Gi'
      - '--cpu'
      - '4'
      - '--gpu'
      - '1'
      - '--gpu-type'
      - 'nvidia-l4'
      - '--timeout'
      - '3600'
      - '--concurrency'
      - '3'
      - '--max-instances'
      - '10'
      - '--no-cpu-throttling'
      - '--no-zonal-redundancy'
      - '--set-env-vars'
      - 'GCS_BUCKET=landbrugsdata-1-sheet-music,PROJECT_ID=$PROJECT_ID,REGION=europe-west4,OWNER_EMAIL=danskcollignon@gmail.com,ENVIRONMENT=production'
      - '--service-account'
      - 'song-to-sheet-music-sa@$PROJECT_ID.iam.gserviceaccount.com'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/song-to-sheet-music:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/song-to-sheet-music:latest'

# Build timeout (2 hours)
timeout: 7200s

# Build options
options:
  # Use high-performance machine type for faster builds
  machineType: 'E2_HIGHCPU_8'

  # Increase disk size for large image builds
  diskSizeGb: 100

  # Enable Docker layer caching
  substitution_option: 'ALLOW_LOOSE'

  # Logging options
  logging: CLOUD_LOGGING_ONLY

# Substitutions (can be overridden at build time)
substitutions:
  _SERVICE_NAME: 'song-to-sheet-music'
  _REGION: 'europe-west4'

# Tags for build tracking
tags:
  - 'song-to-sheet-music'
  - 'gcp-cloud-run'
  - 'production'
